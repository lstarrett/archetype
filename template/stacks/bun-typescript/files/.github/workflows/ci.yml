# Lint, typecheck, and test on every push and pull request, then resolve the build's version the
# way a release step would stamp it (ARCHITECTURE.md#app-version).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: the patch is a commit count, which a shallow clone cannot produce.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Resolve version
        run: bun run src/version.ts
